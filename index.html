<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lawform</title>
  <!-- 2026-10-30: 새 서비스 https://www.lawform.kr 로 넘기는 페이지.
       블루웹 도메인 포워딩은 SSL 이 안 돼서(https://lawform.kr 이 보안 경고) 루트 주소는 GitHub Pages 에서 넘긴다.
       같은 내용이 404.html 에도 있어 lawform.kr/어떤경로 → www.lawform.kr/어떤경로 로 간다.
       10/30 오후: 예전에 www.lawform.kr 이 이 GitHub Pages 를 가리킬 때 들어온 적 있는 브라우저는
       GitHub 의 'www → lawform.kr' 301 을 기한 없이 기억해서, 여기서 www 로 보내면 둘이 끝없이 왕복했다.
       그래서 넘길 때 ?via=lawform.kr 꼬리표를 붙여 기억된 주소와 다르게 만들고(새 사이트가 주소창에서 지움),
       같은 탭에서 30초 안에 세 번 넘게 오면 자동 이동을 멈추고 링크를 보여 준다. -->
  <link rel="canonical" href="https://www.lawform.kr/">
  <meta name="robots" content="noindex">
  <noscript><meta http-equiv="refresh" content="0; url=https://www.lawform.kr/?via=lawform.kr"></noscript>
  <script>
    (function () {
      var search = location.search ? location.search + '&via=lawform.kr' : '?via=lawform.kr';
      var target = 'https://www.lawform.kr' + location.pathname + search + location.hash;
      var now = new Date().getTime();
      var recent = [];
      try {
        var saved = JSON.parse(sessionStorage.getItem('lawform-redirect') || '[]');
        for (var i = 0; i < saved.length; i++) {
          if (now - saved[i] < 30000) recent.push(saved[i]);
        }
      } catch (e) {}
      recent.push(now);
      try {
        sessionStorage.setItem('lawform-redirect', JSON.stringify(recent));
      } catch (e) {}
      if (recent.length <= 3) {
        location.replace(target);
      } else {
        document.documentElement.className = 'is-stuck';
      }
    })();
  </script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
      background: #05070d;
      color: #e8e4d8;
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      text-align: center;
      line-height: 1.6;
    }

    a {
      color: #d9b25f;
    }

    .stuck {
      display: none;
    }

    .is-stuck .moving {
      display: none;
    }

    .is-stuck .stuck {
      display: block;
    }
  </style>
</head>
<body>
  <p class="moving">AI Lawform 새 주소 <a href="https://www.lawform.kr/?via=lawform.kr">www.lawform.kr</a> 로 이동하고 있어요.</p>
  <div class="stuck">
    <p>자동 이동이 되풀이돼서 멈췄어요. <a href="https://www.lawform.kr/?via=lawform.kr">여기를 눌러</a> AI Lawform 으로 가 주세요.</p>
    <p>그래도 안 열리면 브라우저의 인터넷 사용 기록(캐시)을 지우거나 시크릿 창에서 열어 주세요.</p>
  </div>
</body>
</html>
